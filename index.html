<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para a Milly</title>
    <link rel="icon" type="image/x-icon" href="./imagem.png">
    <link rel="stylesheet" href="./style.css">
    <script src="./index.js" type="text/javascript" defer></script>
</head>
<body>
    <div id="heartsBg"></div>

    <header class="hero">
        <h1>Para a Milly 💕</h1>
        <p class="subtitle">Um sitezinho bobo (mas com amor de verdade) só pra você</p>
    </header>

    <section class="scene">
        <div class="stage">
            <span class="ground"></span>
            <span class="person p1">🚶‍♂️</span>
            <span class="person p2">🚶‍♀️</span>
            <span class="heart-pop">💞</span>
        </div>
        <p class="caption">eu e você, sempre</p>
    </section>

    <section class="counter">
        <div class="counter-card">
            <span id="days">0</span>
            <p>dias namorando comigo (e aguentando minhas piadas ruins)</p>
        </div>
    </section>

    <footer>
        <p>Feito com 💗, café e um pouquinho de JavaScript quebrado</p>
    </footer>
</body>
</html>
